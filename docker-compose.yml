version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sketch
      POSTGRES_USER: sketch
      POSTGRES_PASSWORD: sketch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ws-backend:
    build:
      context: .
      dockerfile: apps/ws-backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://sketch:sketch@postgres:5432/sketch
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_WS_URL: ws://ws-backend:8080
    depends_on:
      - ws-backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: